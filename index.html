<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barbaadi</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
  transition:.3s;
}

body.dark{
  background:#111827;
  color:#f3f4f6;
}

header{
  background:linear-gradient(135deg,#075e54,#0f9d58);
  color:white;
  padding:22px 15px;
  text-align:center;
  box-shadow:0 3px 12px #0002;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:6px;
  opacity:.9;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.searchBox{
  background:white;
  padding:15px;
  border-radius:18px;
  margin-top:15px;
  box-shadow:0 3px 15px #0001;
}

body.dark .searchBox,
body.dark .card,
body.dark .historyBox{
  background:#1f2937;
}

.searchRow{
  display:flex;
  gap:8px;
}

#query{
  flex:1;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

#searchBtn{
  border:none;
  border-radius:12px;
  padding:0 20px;
  background:#075e54;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:12px 0;
}

.tabs button{
  white-space:nowrap;
  border:none;
  padding:10px 15px;
  border-radius:20px;
  background:#e8eef5;
  cursor:pointer;
}

body.dark .tabs button{
  background:#374151;
  color:white;
}

.tabs button.active{
  background:#075e54;
  color:white;
}

.tools{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.tools button{
  border:none;
  padding:10px 13px;
  border-radius:10px;
  cursor:pointer;
  background:#fff;
}

body.dark .tools button{
  background:#374151;
  color:white;
}

#status{
  text-align:center;
  margin:15px 0;
  font-weight:bold;
}

.results{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 14px #0001;
  overflow:hidden;
}

.card img{
  width:100%;
  max-height:230px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
}

.card h3{
  margin-bottom:8px;
  line-height:1.4;
}

.card p{
  line-height:1.6;
  color:#667085;
}

body.dark .card p{
  color:#cbd5e1;
}

.card a{
  display:inline-block;
  margin-top:12px;
  background:#075e54;
  color:white;
  text-decoration:none;
  padding:9px 13px;
  border-radius:9px;
}

.card .small{
  font-size:13px;
  margin-top:7px;
}

.cardActions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.cardActions button{
  border:none;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
}

.historyBox{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-top:15px;
}

.historyItem{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #ddd;
}

.historyItem button{
  border:none;
  background:none;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#667085;
}

@media(max-width:600px){
  .searchRow{
    flex-direction:column;
  }

  #searchBtn{
    padding:13px;
  }

  .logo{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🔎 Barbaadi</div>
  <div class="subtitle">
    Barbaadi — Barruu, Suuraa, Video, Audio, Kitaaba fi Bakka
  </div>
</header>

<div class="container">

  <div class="searchBox">

    <div class="searchRow">
      <input
        id="query"
        type="search"
        placeholder="Waan barbaaddu barreessi..."
      >
      <button id="searchBtn" onclick="search()">🔎 Barbaadi</button>
    </div>

    <div class="tabs">

      <button class="active" onclick="setType('all',this)">
        Hunda
      </button>

      <button onclick="setType('text',this)">
        📝 Barruu
      </button>

      <button onclick="setType('image',this)">
        🖼️ Suuraa
      </button>

      <button onclick="setType('video',this)">
        🎬 Video
      </button>

      <button onclick="setType('audio',this)">
        🎵 Audio
      </button>

      <button onclick="setType('book',this)">
        📚 Kitaaba
      </button>

      <button onclick="setType('place',this)">
        📍 Bakka
      </button>

      <button onclick="setType('web',this)">
        🌐 Web
      </button>

    </div>

    <div class="tools">

      <button onclick="toggleDark()">
        🌙 Dark
      </button>

      <button onclick="showHistory()">
        🕘 Seenaa
      </button>

      <button onclick="clearResults()">
        🗑️ Haqi
      </button>

    </div>

  </div>

  <div id="status"></div>

  <div id="results" class="results"></div>

  <div id="history"></div>

</div>

<footer>
  <b>Barbaadi</b><br>
  Search app Afaan Oromoo fi afaanota gara garaa
</footer>


<script>

let currentType = "all";

const queryInput = document.getElementById("query");
const results = document.getElementById("results");
const statusBox = document.getElementById("status");

queryInput.addEventListener("keydown",function(e){
  if(e.key === "Enter"){
    search();
  }
});


function setType(type,button){

  currentType = type;

  document.querySelectorAll(".tabs button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

}


async function search(){

  const q = queryInput.value.trim();

  if(!q){
    alert("Maaloo waan barbaaddu barreessi.");
    return;
  }

  saveHistory(q);

  results.innerHTML = "";

  statusBox.innerHTML = "⏳ Barbaadaa jira...";

  try{

    if(currentType === "all"){
      await searchAll(q);
    }

    else if(currentType === "text"){
      await searchWikipedia(q);
    }

    else if(currentType === "image"){
      await searchImages(q);
    }

    else if(currentType === "video"){
      await searchVideo(q);
    }

    else if(currentType === "audio"){
      await searchAudio(q);
    }

    else if(currentType === "book"){
      await searchBooks(q);
    }

    else if(currentType === "place"){
      await searchPlaces(q);
    }

    else if(currentType === "web"){
      searchWeb(q);
    }

    statusBox.innerHTML =
      results.children.length
      ? "✅ Bu'aan argameera"
      : "❌ Bu'aan hin argamne";

  }catch(error){

    console.error(error);

    statusBox.innerHTML =
      "⚠️ Rakkoo uumame. Mee irra deebi'ii yaali.";

  }

}


/* =========================
   ALL
========================= */

async function searchAll(q){

  const data = await Promise.allSettled([

    searchWikipedia(q),

    searchImages(q),

    searchBooks(q),

    searchVideo(q),

    searchAudio(q)

  ]);

}


/* =========================
   WIKIPEDIA
========================= */

async function searchWikipedia(q){

  const url =
  "https://om.wikipedia.org/w/api.php" +
  "?action=query" +
  "&generator=search" +
  "&gsrsearch=" + encodeURIComponent(q) +
  "&gsrnamespace=0" +
  "&gsrlimit=10" +
  "&prop=extracts|info" +
  "&exintro=1" +
  "&explaintext=1" +
  "&inprop=url" +
  "&format=json" +
  "&origin=*";

  const response = await fetch(url);

  const data = await response.json();

  const pages = data.query?.pages || {};

  Object.values(pages).forEach(page => {

    addCard({

      title: "📝 " + page.title,

      text:
        page.extract ||
        "Odeeffannoon gahaan hin argamne.",

      link:
        page.fullurl ||
        "https://om.wikipedia.org/wiki/" +
        encodeURIComponent(page.title),

      source:"Wikipedia Afaan Oromoo"

    });

  });

}


/* =========================
   IMAGES
========================= */

async function searchImages(q){

  const url =
  "https://commons.wikimedia.org/w/api.php" +
  "?action=query" +
  "&generator=search" +
  "&gsrsearch=" + encodeURIComponent(q) +
  "&gsrnamespace=6" +
  "&gsrlimit=20" +
  "&prop=imageinfo" +
  "&iiprop=url" +
  "&iiurlwidth=600" +
  "&format=json" +
  "&origin=*";

  const response = await fetch(url);

  const data = await response.json();

  const pages = data.query?.pages || {};

  Object.values(pages).forEach(page => {

    const info = page.imageinfo?.[0];

    if(!info) return;

    addCard({

      title:"🖼️ " + page.title,

      image:
        info.thumburl ||
        info.url,

      link:
        "https://commons.wikimedia.org/wiki/" +
        encodeURIComponent(page.title),

      source:"Wikimedia Commons"

    });

  });

}


/* =========================
   INTERNET ARCHIVE VIDEO
========================= */

async function searchVideo(q){

  const url =
  "https://archive.org/advancedsearch.php" +
  "?q=" + encodeURIComponent(q) +
  "%20AND%20mediatype%3Amovies" +
  "&fl%5B%5D=identifier" +
  "&fl%5B%5D=title" +
  "&fl%5B%5D=description" +
  "&rows=15" +
  "&page=1" +
  "&output=json";

  const response = await fetch(url);

  const data = await response.json();

  const docs =
    data.response?.docs || [];

  docs.forEach(item => {

    addCard({

      title:"🎬 " + (item.title || item.identifier),

      text:
        item.description ||
        "Video Internet Archive keessatti argame.",

      link:
        "https://archive.org/details/" +
        item.identifier,

      source:"Internet Archive"

    });

  });

}


/* =========================
   AUDIO
========================= */

async function searchAudio(q){

  const url =
  "https://archive.org/advancedsearch.php" +
  "?q=" + encodeURIComponent(q) +
  "%20AND%20mediatype%3Aaudio" +
  "&fl%5B%5D=identifier" +
  "&fl%5B%5D=title" +
  "&fl%5B%5D=description" +
  "&rows=15" +
  "&page=1" +
  "&output=json";

  const response = await fetch(url);

  const data = await response.json();

  const docs =
    data.response?.docs || [];

  docs.forEach(item => {

    addCard({

      title:"🎵 " + (item.title || item.identifier),

      text:
        item.description ||
        "Audio Internet Archive keessatti argame.",

      link:
        "https://archive.org/details/" +
        item.identifier,

      source:"Internet Archive"

    });

  });

}


/* =========================
   BOOKS
========================= */

async function searchBooks(q){

  const url =
    "https://openlibrary.org/search.json?q=" +
    encodeURIComponent(q) +
    "&limit=15";

  const response = await fetch(url);

  const data = await response.json();

  const docs = data.docs || [];

  docs.forEach(book => {

    const authors =
      book.author_name
      ? book.author_name.join(", ")
      : "Barreessaan hin beekamne";

    addCard({

      title:"📚 " +
        (book.title || "Kitaaba"),

      text:
        "Barreessaa: " +
        authors +
        "<br>" +
        "Bara: " +
        (book.first_publish_year || "—"),

      link:
        "https://openlibrary.org" +
        (book.key || ""),

      source:"Open Library"

    });

  });

}


/* =========================
   PLACES
========================= */

async function searchPlaces(q){

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&q=" + encodeURIComponent(q) +
    "&limit=15" +
    "&accept-language=om";

  const response = await fetch(url);

  const data = await response.json();

  data.forEach(place => {

    const map =
      "https://www.openstreetmap.org/" +
      "?mlat=" + place.lat +
      "&mlon=" + place.lon +
      "#map=15/" +
      place.lat +
      "/" +
      place.lon;

    addCard({

      title:"📍 " + place.display_name,

      text:
        "Latitude: " +
        place.lat +
        "<br>Longitude: " +
        place.lon,

      link:map,

      source:"OpenStreetMap"

    });

  });

}


/* =========================
   WEB
========================= */

function searchWeb(q){

  const google =
    "https://www.google.com/search?q=" +
    encodeURIComponent(q);

  const bing =
    "https://www.bing.com/search?q=" +
    encodeURIComponent(q);

  const duck =
    "https://duckduckgo.com/?q=" +
    encodeURIComponent(q);

  addCard({

    title:"🌐 Web Search",

    text:
      "Madda web keessaa barbaadi.",

    link:duck,

    source:"DuckDuckGo"

  });

  addCard({

    title:"🔎 Bing",

    text:
      "Barbaacha Bing banuuf cuqaasi.",

    link:bing,

    source:"Bing"

  });

  addCard({

    title:"🔍 Google",

    text:
      "Barbaacha Google banuuf cuqaasi.",

    link:google,

    source:"Google"

  });

}


/* =========================
   CARD
========================= */

function addCard(data){

  const card =
    document.createElement("div");

  card.className = "card";

  let html = "";

  if(data.image){

    html +=
      `<img src="${escapeHtml(data.image)}"
       loading="lazy"
       onerror="this.style.display='none'">`;

  }

  html +=
    `<h3>${escapeHtml(data.title || "")}</h3>`;

  if(data.text){

    html +=
      `<p>${data.text}</p>`;

  }

  if(data.source){

    html +=
      `<div class="small">
       📌 ${escapeHtml(data.source)}
       </div>`;

  }

  if(data.link){

    html +=
      `<a href="${escapeHtml(data.link)}"
       target="_blank"
       rel="noopener">
       Bana
       </a>`;

    html +=
      `<div class="cardActions">

        <button onclick="copyText('${escapeJs(data.link)}')">
          📋 Copy
        </button>

        <button onclick="shareResult('${escapeJs(data.title || '')}','${escapeJs(data.link)}')">
          📤 Share
        </button>

        <button onclick="favorite('${escapeJs(data.title || '')}','${escapeJs(data.link)}')">
          ⭐
        </button>

      </div>`;

  }

  card.innerHTML = html;

  results.appendChild(card);

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "barbaadiDark",
    document.body.classList.contains("dark")
  );

}


/* =========================
   HISTORY
========================= */

function saveHistory(q){

  let history =
    JSON.parse(
      localStorage.getItem("barbaadiHistory") || "[]"
    );

  history =
    history.filter(x => x !== q);

  history.unshift(q);

  history =
    history.slice(0,20);

  localStorage.setItem(
    "barbaadiHistory",
    JSON.stringify(history)
  );

}


function showHistory(){

  const box =
    document.getElementById("history");

  let history =
    JSON.parse(
      localStorage.getItem("barbaadiHistory") || "[]"
    );

  if(!history.length){

    box.innerHTML =
      `<div class="historyBox">
       Seenaa barbaachaa hin jiru.
       </div>`;

    return;

  }

  let html =
    `<div class="historyBox">
      <h3>🕘 Seenaa Barbaachaa</h3>`;

  history.forEach(item => {

    html +=
      `<div class="historyItem">

        <span>${escapeHtml(item)}</span>

        <button onclick="useHistory('${escapeJs(item)}')">
          🔎
        </button>

      </div>`;

  });

  html += "</div>";

  box.innerHTML = html;

}


function useHistory(q){

  queryInput.value = q;

  search();

}


/* =========================
   FAVORITE
========================= */

function favorite(title,link){

  let fav =
    JSON.parse(
      localStorage.getItem("barbaadiFavorites") || "[]"
    );

  if(!fav.some(x => x.link === link)){

    fav.push({
      title:title,
      link:link
    });

    localStorage.setItem(
      "barbaadiFavorites",
      JSON.stringify(fav)
    );

    alert("⭐ Kuusaa keessatti galmaa'e.");

  }else{

    alert("Dursee kuusaa keessa jira.");

  }

}


/* =========================
   SHARE
========================= */

async function shareResult(title,link){

  if(navigator.share){

    await navigator.share({

      title:title,

      text:title,

      url:link

    });

  }else{

    copyText(link);

    alert("Linkiin copy godhame.");

  }

}


/* =========================
   COPY
========================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    alert("📋 Copy godhame.");

  }catch(e){

    alert("Copy gochuun hin danda'amne.");

  }

}


/* =========================
   CLEAR
========================= */

function clearResults(){

  results.innerHTML = "";

  statusBox.innerHTML = "";

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;")
    .replace(/\n/g," ");

}


/* =========================
   LOAD SETTINGS
========================= */

if(
  localStorage.getItem("barbaadiDark") === "true"
){

  document.body.classList.add("dark");

}

</script>

</body>
  </html>
